<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Film Location CRM</title>
    <meta
      name="description"
      content="The Film Location CRM — locations, owners, productions, enquiries, scouting, bookings, quotations, invoices and permits for film, TV, commercial and photography shoots."
    />
    <meta name="theme-color" content="#0B0B0C" />

    <meta property="og:title" content="The Film Location CRM" />
    <meta
      property="og:description"
      content="Location management CRM for film, TV, commercial and photography productions."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Archivo:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="mask-icon" href="/mask-icon.svg?v=2" color="#0B0B0C" />
    <link rel="manifest" href="/site.webmanifest?v=2" />

    <!--
      Apply the saved theme before the first paint. React can't do this — by the
      time the bundle has parsed and mounted, a light-mode user has already been
      shown a frame of navy. Kept deliberately tiny and dependency-free; the
      provider in src/lib/theme.tsx owns the value from then on.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("tfl.web.theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
